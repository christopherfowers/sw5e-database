services:
  postgres:
    image: postgres:17-alpine
    container_name: sw5e-postgres
    environment:
      POSTGRES_DB: sw5e
      POSTGRES_USER: sw5e
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devonly_change_me}
    ports:
      - "5432:5432"
    volumes:
      - sw5e-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sw5e -d sw5e"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sw5e-pgdata:
