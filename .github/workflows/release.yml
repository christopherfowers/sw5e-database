name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/christopherfowers/sw5e-database

jobs:
  publish-image:
    name: Build and publish container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Signed build provenance for the pushed image.
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            # Full 40-character SHA. The homelab deploy contract calls
            # deploy.sh "sha-${GITHUB_SHA}" and rejects anything that is not a
            # full SHA, so a short tag would name an image that was never
            # pushed. `latest` is a convenience fallback, never a deploy target.
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ── Deploy ─────────────────────────────────────────────────────────────────
  # The QA host runs a self-hosted runner that polls GitHub outbound, so no
  # inbound port is opened. The runner holds no secrets and has no broad Docker
  # access: its only privilege is a sudoers rule permitting this one script
  # path. Everything host-side — image pull, the content-publish gate, the
  # controlled restart, the health check — lives in deploy.sh on the host.
  #
  # Gated on the DEPLOY_ENABLED repository variable. A job targeting a runner
  # label that is not registered yet does not fail, it queues indefinitely, so
  # without this gate every merge would leave a run pending forever. Set the
  # variable once the runner is up.
  deploy:
    name: Deploy to QA
    needs: publish-image
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, marvel, sw5e]
    permissions:
      contents: read
    environment:
      name: qa
      url: https://sw5e.cfowers.io
    concurrency:
      # Serialises deploys originating from THIS repository. GitHub scopes
      # concurrency to one repository, so it cannot serialise against the other
      # two — and all three drive a single compose stack sharing one .env.
      # deploy.sh therefore takes a lock of its own; this group only stops a
      # repository from racing itself.
      group: deploy-sw5e-qa
      cancel-in-progress: false
    steps:
      # The immutable long SHA is the only thing ever deployed; deploy.sh
      # rejects `latest` and anything that is not a 40-character SHA tag. Naming
      # the service means only this component's tag moves, so a merge here
      # cannot roll the other two back or forward.
      - name: Deploy this commit
        run: sudo -u jannet /srv/homelab/apps/sw5e/deploy.sh database "sha-${{ github.sha }}"
